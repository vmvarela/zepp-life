name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

env:
  NFPM_VERSION: "2.45.1"
  ACTIONLINT_VERSION: "v1.7.11"

jobs:
  checks:
    name: Formatting, workflow and manifest checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Go toolchain matches go.mod
        shell: bash
        run: |
          set -euo pipefail
          mod="$(awk '/^go /{ print $2; exit }' go.mod)"
          case "$mod" in
            *.*.*) ;;
            *)
              echo "::error::go.mod declares 'go $mod'; keep a full x.y.z pin so CI and the release build the same toolchain"
              exit 1
              ;;
          esac
          got="$(go env GOVERSION)"
          if [ "$got" != "go$mod" ]; then
            echo "::error::toolchain $got does not match go.mod 'go $mod'"
            exit 1
          fi

      - name: gofmt
        shell: bash
        run: |
          set -euo pipefail
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            printf '%s\n' "$out"
            echo "::error::gofmt reported unformatted files"
            exit 1
          fi

      - name: Lint workflows (actionlint + shellcheck)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          go run "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"

      - name: npm manifest and wrapper
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const p = require("./packaging/npm/package.json");
            const fail = (m) => { console.error("::error::" + m); process.exit(1); };
            if (p.name !== "@vmvarela/zepp-life") fail("package name is " + p.name);
            if (p.license !== "MIT") fail("license is " + p.license);
            if (p.version !== "0.0.0") fail("version placeholder is " + p.version);
            if (p.bin["zepp-life"] !== "bin/zepp-life.js") fail("bin entry is " + JSON.stringify(p.bin));
          '
          node --check packaging/npm/bin/zepp-life.js
          stub="$(mktemp -d)"
          cp -r packaging/npm/. "$stub/"
          printf '#!/bin/sh\necho "stub $*"\n' > "$stub/bin/zepp-life-linux-x64"
          chmod +x "$stub/bin/zepp-life-linux-x64"
          out="$(node "$stub/bin/zepp-life.js" --version)"
          if [ "$out" != "stub --version" ]; then
            echo "::error::npm wrapper did not exec the staged binary: $out"
            exit 1
          fi

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  release-assets:
    name: Cross-build the six release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build every documented asset name
        shell: bash
        env:
          VERSION: "0.0.0"
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/dist"
          mkdir -p "$dist"
          build() {
            CGO_ENABLED=0 GOOS="$1" GOARCH="$2" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "$dist/$3" .
          }
          build linux   amd64 zepp-life-linux-amd64
          build linux   arm64 zepp-life-linux-arm64
          build darwin  amd64 zepp-life-darwin-amd64
          build darwin  arm64 zepp-life-darwin-arm64
          build windows amd64 zepp-life-windows-amd64.exe
          build windows arm64 zepp-life-windows-arm64.exe
          for name in zepp-life-linux-amd64 zepp-life-linux-arm64 \
                      zepp-life-darwin-amd64 zepp-life-darwin-arm64 \
                      zepp-life-windows-amd64.exe zepp-life-windows-arm64.exe; do
            if [ ! -s "$dist/$name" ]; then
              echo "::error::missing or empty asset $name"
              exit 1
            fi
          done

      - name: --version carries the injected version
        shell: bash
        run: |
          set -euo pipefail
          go build -trimpath -ldflags "-X main.version=9.9.9" -o "$RUNNER_TEMP/zepp-life" .
          out="$("$RUNNER_TEMP/zepp-life" --version)"
          if [ "$out" != "zepp-life 9.9.9" ]; then
            echo "::error::--version printed '$out'"
            exit 1
          fi

  packaging:
    name: Man page and native packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install scdoc and nfpm
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y scdoc
          curl -sfL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          sudo tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm

      - name: Stage binary, man page, license and notices
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/pkg-work"
          mkdir -p "$work/dist"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w -X main.version=0.0.0" -o "$work/zepp-life" .
          scdoc < docs/zepp-life.1.scd | gzip -n > "$work/zepp-life.1.gz"
          cp LICENSE "$work/LICENSE"
          cp THIRD_PARTY_NOTICES.txt "$work/THIRD_PARTY_NOTICES.txt"

      - name: Build deb, rpm and apk
        shell: bash
        working-directory: ${{ runner.temp }}/pkg-work
        run: |
          set -euo pipefail
          for packager in deb rpm apk; do
            VERSION=0.0.0 GOARCH=amd64 nfpm package -p "$packager" \
              -f "$GITHUB_WORKSPACE/packaging/nfpm.yaml" -t dist/
          done
          for name in zepp-life_0.0.0_amd64.deb zepp-life-0.0.0-1.x86_64.rpm zepp-life_0.0.0_x86_64.apk; do
            if [ ! -s "dist/$name" ]; then
              echo "::error::missing package $name"
              ls -l dist
              exit 1
            fi
          done
