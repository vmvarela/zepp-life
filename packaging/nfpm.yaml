# nfpm package configuration for zepp-life
# Used by the CI release workflow to generate .deb, .rpm and .apk packages.
#
# Variables injected by the CI environment before invoking nfpm:
#   VERSION  — semver without leading "v" (e.g. "0.1.0")
#   GOARCH   — nfpm architecture token:
#                amd64   → x86_64 binaries  (deb: amd64,   rpm: x86_64, apk: x86_64)
#                arm64   → aarch64 binaries (deb: arm64,   rpm: aarch64, apk: aarch64)
#
# Invocation (from the CI working directory that contains the staged files):
#   VERSION=0.1.0 GOARCH=amd64 nfpm package -p deb -f packaging/nfpm.yaml -t dist/
#   VERSION=0.1.0 GOARCH=amd64 nfpm package -p rpm  -f packaging/nfpm.yaml -t dist/
#   VERSION=0.1.0 GOARCH=amd64 nfpm package -p apk  -f packaging/nfpm.yaml -t dist/

name: zepp-life
arch: "${GOARCH}"
version: "${VERSION}"
maintainer: vmvarela <vmvarela@gmail.com>
description: Store your Zepp Life data locally and inspect it
homepage: https://github.com/vmvarela/zepp-life
license: MIT

contents:
  # Binary — installed into /usr/bin and made executable
  - src: ./zepp-life
    dst: /usr/bin/zepp-life
    file_info:
      mode: 0755

  # Man page — gzipped under /usr/share/man/man1/ (deb, rpm and apk)
  - src: ./zepp-life.1.gz
    dst: /usr/share/man/man1/zepp-life.1.gz
    file_info:
      mode: 0644

  # License — Debian policy: copyright file under /usr/share/doc/<pkg>/
  - src: ./LICENSE
    dst: /usr/share/doc/zepp-life/copyright
    packager: deb

  # License — RPM convention: under /usr/share/licenses/<pkg>/
  - src: ./LICENSE
    dst: /usr/share/licenses/zepp-life/LICENSE
    packager: rpm

  # License — Alpine convention: under /usr/share/licenses/<pkg>/
  - src: ./LICENSE
    dst: /usr/share/licenses/zepp-life/LICENSE
    packager: apk

  # Third-party notices — Debian convention: alongside the copyright file
  - src: ./THIRD_PARTY_NOTICES.txt
    dst: /usr/share/doc/zepp-life/THIRD_PARTY_NOTICES.txt
    packager: deb

  # Third-party notices — RPM convention: under /usr/share/licenses/<pkg>/
  - src: ./THIRD_PARTY_NOTICES.txt
    dst: /usr/share/licenses/zepp-life/THIRD_PARTY_NOTICES.txt
    packager: rpm

  # Third-party notices — Alpine convention: under /usr/share/licenses/<pkg>/
  - src: ./THIRD_PARTY_NOTICES.txt
    dst: /usr/share/licenses/zepp-life/THIRD_PARTY_NOTICES.txt
    packager: apk
